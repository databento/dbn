[package]
name = "dbn"
description = "Library for working with Databento Binary Encoding (DBN)"
keywords = ["finance", "market-data", "conversion", "encoding", "trading"]
# see https://crates.io/category_slugs
categories = ["encoding"]
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
# Document all features on docs.rs
all-features = true
# To build locally: `RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features --open`
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["zstd"]
arrow = ["dep:arrow"]
async = ["dep:async-compression", "dep:async-stream", "dep:futures-core", "dep:tokio", "zstd"]
parquet = ["arrow", "dep:parquet", "zstd"]
python = ["dep:pyo3", "dep:strum", "zstd"]
serde = ["dep:serde", "time/parsing", "time/serde"]
# Enables deriving the `Copy` trait for records.
trivial_copy = []
# Enables Zstandard. Disabling it leaves the crate with no C dependencies
zstd = ["dep:zstd"]

[dependencies]
dbn-macros = { version = "=0.72.0", path = "../dbn-macros" }

arrow = { workspace = true, optional = true, features = ["ipc", "ipc_compression"] }
async-compression = { version = "0.4.50", features = ["tokio", "zstd"], optional = true }
async-stream = { version = "0.3", optional = true }
futures-core = { version = "0.3", optional = true }
csv = { workspace = true }
fallible-streaming-iterator = { version = "0.1.9", features = ["std"] }
# Fast integer to string conversion
itoa = "1.0"
num_enum = "0.7"
parquet = { workspace = true, optional = true, features = ["arrow", "zstd"] }
pyo3 = { workspace = true, features = ["time"], optional = true }
json-writer = "0.4"
serde = { workspace = true, features = ["derive"], optional = true }
# extra enum traits for Python
strum = { version = "0.28", features = ["derive"], optional = true }
thiserror = "2.0"
time = { workspace = true, features = ["formatting", "macros"] }
tokio = { version = ">=1.47", features = ["fs", "io-util"], optional = true }
zstd = { workspace = true, optional = true }

[dev-dependencies]
bytes = "1"
rstest = { workspace = true }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
# Checking alignment and padding
type-layout = "0.2.0"
