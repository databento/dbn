[package]
name = "databento-dbn"
description = "Python library written in Rust for working with Databento Binary Encoding (DBN)"
# This crate should only be published as a Python package
publish = false
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "databento_dbn" # Python modules can't contain dashes

[dependencies]
dbn = { path = "../rust/dbn", features = ["parquet", "python"] }
pyo3.workspace = true
sync_wrapper.workspace = true
time.workspace = true
zstd.workspace = true

[dev-dependencies]
arrow = { workspace = true, features = ["ipc"] }
bytes = "1"
parquet = { workspace = true, features = ["arrow"] }
rstest.workspace = true
